name: drift

# Daily: does the tenant still match the code? Runs a read-only plan with
# ca-plan. Exit 2 means something changed outside the pipeline (a portal
# edit, usually) and opens or updates one issue; exit 0 closes it.

on:
  schedule:
    - cron: "0 13 * * *" # daily, 13:00 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: policies
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.CA_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_breakglass_group_object_id: ${{ secrets.BREAKGLASS_GROUP_ID }}
      TF_VAR_trusted_ip_ranges: ${{ secrets.TRUSTED_IP_RANGES }}
      TENANT_NAME: ${{ secrets.TENANT_NAME }}
      TF_IN_AUTOMATION: "true"
      ISSUE_TITLE: "Conditional Access drift detected"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false
      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=conditional-access.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Plan
        id: plan
        run: |
          code=0
          terraform plan -input=false -no-color -lock=false -detailed-exitcode > plan.raw 2>&1 || code=$?
          ../.github/scripts/redact.sh < plan.raw > plan.txt
          rm -f plan.raw
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi

      - name: Open or update the drift issue
        if: steps.plan.outputs.exitcode == '2'
        run: |
          {
            echo "The daily plan found differences between the tenant and \`main\` (IDs redacted)."
            echo "Someone changed a policy outside the pipeline, or a merge has not been applied yet."
            echo
            echo "Decide: revert the portal change by re-applying, or adopt it by updating the code."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } > body.md
          gh label create drift --description "Tenant no longer matches main" --color D93F0B --force >/dev/null 2>&1 || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label drift --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file body.md
            echo "::warning::drift still present; updated issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --label drift --body-file body.md
            echo "::warning::drift detected; opened an issue"
          fi
          { echo '### Drift detected (IDs redacted)'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Close the drift issue if resolved
        if: steps.plan.outputs.exitcode == '0'
        run: |
          echo "No drift. Tenant matches main." >> "$GITHUB_STEP_SUMMARY"
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label drift --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Resolved: today's plan shows no differences. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
