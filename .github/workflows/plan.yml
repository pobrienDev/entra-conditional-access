name: plan

# Every pull request: format, validate, plan with the read-only identity, run
# the guardrails on the plan JSON, and post a redacted plan to the PR.
# Nothing here can change the tenant: ca-plan holds no write permission and
# no lease on the state blob.

on:
  pull_request:

# id-token lets the job request a GitHub OIDC token, which Entra ID exchanges
# for a Graph token via ca-plan's federated credential. No secret is stored.
permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrail-tests:
    name: guardrail tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r guardrails/requirements-dev.txt
      - run: python -m pytest -q

  plan:
    runs-on: ubuntu-latest
    # Fork PRs get no OIDC token and no secrets, so the job could only fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: policies
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.CA_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_breakglass_group_object_id: ${{ secrets.BREAKGLASS_GROUP_ID }}
      TF_VAR_trusted_ip_ranges: ${{ secrets.TRUSTED_IP_RANGES }}
      # The guardrail reads this from the environment, never from the repo,
      # so a pull request cannot change which group must be excluded.
      BREAKGLASS_GROUP_ID: ${{ secrets.BREAKGLASS_GROUP_ID }}
      TENANT_NAME: ${{ secrets.TENANT_NAME }} # referenced only so GitHub masks it in logs
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/plan
        id: plan
        with:
          storage-account: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
          args: -lock=false -out=tfplan # -lock=false: ca-plan can read state but not write a lease

      - name: Format and validate
        run: |
          terraform fmt -check -recursive
          terraform validate

      # plan.json is for the guardrails only and is never uploaded. The exit
      # code is captured explicitly: a pipe would hide it and the PR would
      # pass with failing guardrails.
      - name: Guardrails
        id: guardrails
        continue-on-error: true # so the PR comment below still gets posted
        run: |
          terraform show -json tfplan > plan.json
          python3 ../guardrails/check_plan.py plan.json > guardrails.txt 2>&1 || code=$?
          cat guardrails.txt
          exit "${code:-0}"

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.guardrails.outcome }}" = "success" ]; then
            verdict="**Guardrails:** passed"
          else
            verdict="**Guardrails:** FAILED"
          fi
          {
            echo "#### \`terraform plan\` (IDs redacted)"
            echo
            echo "$verdict"
            echo '```'
            cat guardrails.txt
            echo '```'
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md --edit-last \
            || gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

      - name: Fail if guardrails failed
        if: steps.guardrails.outcome != 'success'
        run: |
          echo "::error::guardrails rejected this plan; see the annotations above"
          exit 1
